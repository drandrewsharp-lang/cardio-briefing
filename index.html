<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Cardio Briefing</title>
  <meta name="description" content="Daily cardiology literature briefing">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cardio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Latest edition">
      <img src="icons/favicon-32.png" alt="" width="22" height="22"> Cardio Briefing
    </a>
    <a class="topbar-link" href="#past">Past editions</a>
  </header>

  <main id="main">
    <section id="edition" aria-live="polite">
      <div class="skeleton">Loading latest edition…</div>
    </section>

    <section class="card player" id="player" hidden aria-label="Audio briefing">
      <div class="times"><span id="cur">0:00</span><span id="left">-0:00</span></div>
      <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
      <div class="controls">
        <button id="back" class="round" aria-label="Back 15 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.3" text-anchor="middle">15</text></svg>
        </button>
        <button id="play" class="round big" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        </button>
        <button id="fwd" class="round" aria-label="Forward 30 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.3" text-anchor="middle">30</text></svg>
        </button>
      </div>
      <div class="speed" role="radiogroup" aria-label="Playback speed" id="speed"></div>
      <p class="audio-note" id="audio-note"></p>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <section id="digest"></section>

    <section id="past" class="past">
      <h2>Past editions</h2>
      <ol id="past-list" class="past-list"></ol>
    </section>

    <footer class="foot">
      Summaries are drawn from abstracts only. Always check the full paper before changing practice.
    </footer>
  </main>

  <div class="mini" id="mini" hidden>
    <button id="mini-play" class="round" aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
    <button class="mini-info" id="mini-info" aria-label="Scroll to player">
      <span id="mini-title">Briefing</span><span id="mini-time">0:00</span>
    </button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
